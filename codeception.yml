actor: Tester
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
bootstrap: _bootstrap.php
modules:
    config:
        \craft\test\Craft:
            configFile: 'tests/_craft/config/test.php'
            entryUrl: 'https://craft-varnish-purger.test/index.php'
            projectConfig: {}
            migrations: []
            plugins:
                varnish:
                    class: '\studioespresso\varnish\Varnish'
                    handle: varnish
            cleanup: true
            transaction: true
            dbSetup: {clean: true, setupCraft: true}
