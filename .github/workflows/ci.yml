name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    uses: studioespresso/.github/.github/workflows/ci.yml@main
    with:
      craft_version: '5'
      php_version: '8.4'
      jobs: '["ecs", "phpstan"]'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported PHP (composer.json require + config.platform) up to the newest
        php: ['8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # tests/_bootstrap.php refuses to run against any other database
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, intl

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/codecept run unit
        env:
          DB_SERVER: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_PORT: 3306

  vcl:
    name: vcl (${{ matrix.file }} on Varnish ${{ matrix.varnish }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { file: example.vcl, varnish: '6.6' }
          - { file: example.vcl, varnish: '7.7' }
          - { file: example-varnish-6.0.vcl, varnish: '6.0' }
          - { file: example-varnish-6.0.vcl, varnish: '7.7' }
    steps:
      - uses: actions/checkout@v4
      - name: Compile the example VCL
        # The backend host must resolve at compile time; map the example's `web` to localhost
        run: docker run --rm --add-host web:127.0.0.1 -v "$PWD/${{ matrix.file }}:/etc/varnish/default.vcl:ro" --entrypoint varnishd varnish:${{ matrix.varnish }} -C -f /etc/varnish/default.vcl > /dev/null
